global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'library-api-monitor'

scrape_configs:
  - job_name: 'library-api'
    static_configs:
      - targets: ['library-api:3000']
        labels:
          service: 'library-api'
          environment: 'development'
    
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']